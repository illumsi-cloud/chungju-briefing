name: Update Briefing Dashboard

on:
  schedule:
    - cron: '0 1 * * *'   # 매일 10:00 KST
    - cron: '0 5 * * *'   # 매일 14:00 KST
    - cron: '40 8 * * *'  # 매일 17:40 KST
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 수집 대상 사이트가 응답하지 않아 작업이 매달리면 concurrency 락을 계속 쥐고 있어
    # 이후 실행까지 모두 대기 상태가 된다. 정상 실행은 3분 이내이므로 넉넉히 15분으로 제한한다.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 데이터 수집 및 대시보드 생성
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python briefing_maker.py

      - name: 결과물(index.html · 신규 항목 이력)을 저장소에 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html item_history.json item_cache.json
          git diff --staged --quiet || git commit -m "자동 갱신: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
        
